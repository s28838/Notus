<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Academic Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f45925",
                        "background-light": "#f8f6f5",
                        "background-dark": "#221410",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen pb-24">
<!-- Header -->
<header class="flex items-center justify-between px-6 pt-8 pb-4">
<h1 class="text-2xl font-800 tracking-tight">Profile</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Profile Info Section -->
<div class="flex flex-col items-center px-6 py-6">
<h2 class="mt-4 text-xl font-bold text-slate-900 dark:text-slate-100">Alex Johnson</h2>
<p class="text-slate-500 dark:text-slate-400 font-medium">Student ID: 20230541</p>
</div>
<!-- Academic Information -->
<div class="px-6 mb-8">
<h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3 ml-1">Academic Information</h3>
<div class="grid gap-3">
<div class="flex items-center gap-4 bg-white dark:bg-slate-800/50 p-4 rounded-xl border border-primary/5 shadow-sm">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">school</span>
</div>
<div>
<p class="text-xs text-slate-500 font-medium">Department</p>
<p class="text-sm font-bold text-slate-800 dark:text-slate-200">Computer Science &amp; AI</p>
</div>
</div>
<div class="flex items-center gap-4 bg-white dark:bg-slate-800/50 p-4 rounded-xl border border-primary/5 shadow-sm">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div>
<p class="text-xs text-slate-500 font-medium">Academic Year</p>
<p class="text-sm font-bold text-slate-800 dark:text-slate-200">3rd Year, Semester 2</p>
</div>
</div>
</div>
</div>
<!-- Preferences -->
<div class="px-6 mb-8">
<h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3 ml-1">Preferences</h3>
<div class="bg-white dark:bg-slate-800/50 rounded-xl border border-primary/5 shadow-sm overflow-hidden">
<button class="w-full flex items-center justify-between p-4 border-b border-slate-50 dark:border-slate-700/50 active:bg-slate-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">person</span>
<span class="font-medium text-slate-700 dark:text-slate-200">Account Settings</span>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 border-b border-slate-50 dark:border-slate-700/50 active:bg-slate-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">notifications</span>
<span class="font-medium text-slate-700 dark:text-slate-200">Notification Preferences</span>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 border-b border-slate-50 dark:border-slate-700/50 active:bg-slate-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">verified_user</span>
<span class="font-medium text-slate-700 dark:text-slate-200">Privacy Policy</span>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 active:bg-slate-50 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">help</span>
<span class="font-medium text-slate-700 dark:text-slate-200">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
</div>
<!-- Logout -->
<div class="px-6 mb-12">
<button class="w-full flex items-center justify-center gap-2 py-4 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all">
<span class="material-symbols-outlined">logout</span>
<span>Log Out</span>
</button>
</div>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-6 py-3 flex justify-between items-center z-50">
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-bold">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-[10px] font-bold">Schedule</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-[10px] font-bold">Stats</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-1">person</span>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</body></html>
